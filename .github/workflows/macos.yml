# The macOS apps (docs/macos.md): one per CPU architecture, built natively on GitHub's runners, Apple silicon on macos-26 and
# Intel on macos-15-intel. A published release gets P.T.PC.Port-macOS-arm64.zip and P.T.PC.Port-macOS-x64.zip;
# each architecture also has a PKG/folder installer. The updater keeps its existing portable-app asset URLs,
# so nothing in tools/ci/release.py needs a Mac; run by hand (Actions > macOS > Run workflow) the zips are workflow artifacts.
name: macOS

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [codex/macos-arm64-port, codex/upstream-1.0.4-integration]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    # Preserve the exact audited files on fork releases published with both Mac packages already attached.
    # Upstream releases and manual builds still compile on both native architectures.
    if: >-
      (github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'macos-arm64-preview-')) &&
      (github.event_name != 'release' || !contains(github.event.release.tag_name, '-android-')) &&
      (github.event_name != 'release' || github.repository != 'ignusloki/pt-pc' ||
       !contains(github.event.release.assets.*.name, 'P.T.PC.Port.Setup-macOS-arm64.zip') ||
       !contains(github.event.release.assets.*.name, 'P.T.PC.Port.Setup-macOS-x64.zip') ||
       !contains(github.event.release.assets.*.name, 'P.T.PC.Port-macOS-arm64.zip') ||
       !contains(github.event.release.assets.*.name, 'P.T.PC.Port-macOS-x64.zip'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            cmake_arch: arm64
            runner: macos-26
          - arch: x64
            cmake_arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Tools
        run: brew install ninja shaderc vulkan-headers vulkan-loader

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^set(PT_VERSION "\(.*\)")$/\1/p' CMakeLists.txt)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Packaging regressions
        run: |
          python3 tools/macos/test_packaging.py
          python3 tests/payload_index_test.py

      - name: Build, package and test
        run: |
          test "$(uname -m)" = "${{ matrix.cmake_arch }}"
          python3 tools/macos/build.py --arch "${{ matrix.arch }}" --build build/macos --out dist --version "${{ steps.version.outputs.version }}" --jobs 4 \
            --cmake-arg="-DPT_UPDATE_MANIFEST_URL_OVERRIDE=https://api.github.com/repos/${{ github.repository }}/releases/latest"
          mv "dist/pt-port-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.zip" dist/P.T.PC.Port-macOS-${{ matrix.arch }}.zip
          mv "dist/pt-port-${{ steps.version.outputs.version }}-setup-macos-${{ matrix.arch }}.zip" dist/P.T.PC.Port.Setup-macOS-${{ matrix.arch }}.zip
          lipo -archs "dist/P.T. PC Port.app/Contents/MacOS/pt"

      # the installer: a disk image with the app and a link to Applications to drag it onto (the zip is the portable app)
      - name: Disk image
        run: |
          mkdir -p dmg && cp -R "dist/P.T. PC Port.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "P.T. PC Port" -srcfolder dmg -fs HFS+ -format UDZO "dist/P.T.PC.Port-macOS-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: P.T.PC.Port-macOS-${{ matrix.arch }}-${{ steps.version.outputs.version }}
          path: |
            dist/P.T.PC.Port-macOS-${{ matrix.arch }}.zip
            dist/P.T.PC.Port.Setup-macOS-${{ matrix.arch }}.zip
            dist/installer-self-test.txt
            dist/voice-smoke.log
            dist/P.T.PC.Port-macOS-${{ matrix.arch }}.dmg

  release:
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'macos-arm64-preview-') && !contains(github.event.release.tag_name, '-android-')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: zips
          merge-multiple: true

      - name: Release app assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" zips/P.T.PC.Port-macOS-arm64.zip zips/P.T.PC.Port-macOS-x64.zip zips/P.T.PC.Port.Setup-macOS-arm64.zip zips/P.T.PC.Port.Setup-macOS-x64.zip zips/P.T.PC.Port-macOS-arm64.dmg zips/P.T.PC.Port-macOS-x64.dmg --clobber --repo "$GITHUB_REPOSITORY"
