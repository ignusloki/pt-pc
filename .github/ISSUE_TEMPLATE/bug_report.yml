name: Bug report
description: Something in the port does not work or differs from the PS4 original. A pt.log is required.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Issues without a `pt.log` are closed. Suggestions and questions belong on Discord.

        **Where is pt.log?** In the game's installation folder: `data\pt.log` (Windows), `data/pt.log` next to the game (Linux portable),
        or `~/Library/Application Support/pt-port/pt/pt.log` (macOS). It is rewritten at every start, so attach the one from the run
        where the problem happened (quit the game first). A crash also leaves a `.dmp` file in the same folder; attach it too.
  - type: input
    id: version
    attributes:
      label: Port version
      description: Shown at the bottom of the PC settings page and in the first lines of pt.log.
      placeholder: "1.0.4"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For a visual difference from the PS4, a screenshot or video of both helps the most.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The loop, where you stand, what you do. "Every time" or "once" matters.
    validations:
      required: true
  - type: dropdown
    id: api
    attributes:
      label: Rendering API
      description: The Rendering API row on the Graphics page, also in the first lines of pt.log. Linux and macOS always use Vulkan, and so does every version before 1.0.4.
      options:
        - Vulkan
        - DirectX 12
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: f9
    attributes:
      label: Did you press F9 where it happens?
      description: |
        If the problem shows up at a specific spot, stand there, look at it and press F9 before you quit. The game writes your
        exact position and view into pt.log, so the bug can be checked at the same spot. Press it once per spot if there are several.
      options:
        - "Yes, at every spot"
        - "No"
        - "Not tied to a spot"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: pt.log
      description: Drag the pt.log file into this box (GitHub uploads it and puts its link here), or paste its contents. Required.
      placeholder: Drop pt.log here
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: GPU and OS
      placeholder: "RTX 3060, Windows 11"
    validations:
      required: true
